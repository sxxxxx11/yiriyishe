<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>一日一舍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'LXGWWenKai';
  src: url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'LXGWWenKai';
  src: url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
</style>
<script>
// html2canvas lazy load - avoid blocking if CDN fails
var html2canvas = null;
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload = function(){ html2canvas = window.html2canvas; };
  s.onerror = function(){};
  document.head.appendChild(s);
})();
</script>
<style>
/* ===== CSS Variables ===== */
:root {
  --cream: #f5f0e8;
  --cream-dark: #ede8de;
  --cream-card: #faf8f4;
  --pine: #3d6b52;
  --pine-light: #5a8a6b;
  --pine-pale: #e8f2ec;
  --pine-mist: #c4ddd0;
  --ink: #2c2a25;
  --ink-mid: #5a5850;
  --ink-muted: #9b9890;
  --border: rgba(44,42,37,0.12);
  --border-mid: rgba(44,42,37,0.2);
  --shadow-sm: 0 1px 4px rgba(44,42,37,0.08);
  --shadow-md: 0 4px 16px rgba(44,42,37,0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --bottom-nav-h: 68px;
  --font: 'LXGWWenKai', 'LXGW WenKai', 'Noto Serif SC', 'STKaiti', 'KaiTi', 'FangSong', 'STFangsong', 'SimSun', serif;
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
input, textarea, select, button { font-family: var(--font); }
button { cursor: pointer; border: none; background: none; }
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }

/* ===== App Shell ===== */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* ===== Page System ===== */
.page {
  position: absolute;
  inset: 0;
  bottom: var(--bottom-nav-h);
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--cream);
  display: none;
  -webkit-overflow-scrolling: touch;
}
.page.active { display: block; }
.page::-webkit-scrollbar { display: none; }

/* Page transitions */
.page.slide-in-right { animation: slideInRight .28s ease forwards; }
.page.slide-out-left { animation: slideOutLeft .28s ease forwards; }
.page.slide-in-left { animation: slideInLeft .28s ease forwards; }
.page.slide-out-right { animation: slideOutRight .28s ease forwards; }
.page.fade-in { animation: fadeIn .2s ease forwards; }

@keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-40px); opacity: 0; } }
@keyframes slideInLeft { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(40px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== Bottom Nav ===== */
#bottom-nav {
  height: var(--bottom-nav-h);
  background: rgba(245,240,232,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  position: relative;
  z-index: 100;
  flex-shrink: 0;
  overflow: hidden;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  transition: all .2s ease;
  color: var(--ink-muted);
  min-width: 56px;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  user-select: none;
  -webkit-user-select: none;
}
.nav-item::before, .nav-item::after { display: none; }
.nav-item.active { color: var(--pine); }
.nav-item:active { background: var(--pine-pale); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-label { font-size: 10px; letter-spacing: .3px; }
.nav-item.active .nav-label { font-weight: 600; color: var(--pine); }

/* Center FAB */
.nav-fab {
  width: 52px;
  height: 52px;
  background: var(--pine);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  box-shadow: 0 2px 8px rgba(61,107,82,0.25);
  transition: transform .15s ease, box-shadow .15s ease;
}
.nav-fab:active { transform: scale(.93); box-shadow: 0 1px 4px rgba(61,107,82,0.2); }

/* ===== Page Header ===== */
.page-header {
  padding: 20px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.page-title { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
.page-sub { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }

/* ===== Section Header ===== */
.section-hd {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--ink-muted);
  text-transform: uppercase;
  padding: 0 20px;
  margin: 16px 0 10px;
}

/* ===== Cards ===== */
.card {
  background: var(--cream-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-padded { padding: 16px; }

/* ===== Record Card ===== */
.record-card {
  margin: 0 16px 12px;
  background: var(--cream-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: box-shadow .15s ease;
}
.record-card:active { box-shadow: var(--shadow-md); }
.record-card-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  background: var(--cream-dark);
}
.record-card-body { padding: 12px 14px 14px; }
.record-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.record-card-cat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--pine);
  background: var(--pine-pale);
  padding: 3px 8px;
  border-radius: 20px;
}
.record-card-time { font-size: 11px; color: var(--ink-muted); }
.record-card-name { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.record-card-note { font-size: 13px; color: var(--ink-mid); line-height: 1.5; }

/* ===== Empty State ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 32px;
  text-align: center;
  gap: 10px;
}
.empty-icon { font-size: 42px; opacity: .2; margin-bottom: 4px; color: var(--pine); font-weight: 700; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--ink-mid); }
.empty-sub { font-size: 13px; color: var(--ink-muted); line-height: 1.6; }

/* ===== Pill Tabs ===== */
.pill-tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px;
  margin-bottom: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.pill-tabs::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-mid);
  background: var(--cream-dark);
  border: 1px solid transparent;
  transition: all .15s ease;
  white-space: nowrap;
}
.pill.active {
  background: var(--pine-pale);
  color: var(--pine);
  border-color: var(--pine-mist);
  font-weight: 600;
}
.pill:active { opacity: .7; }

/* ===== Quote Banner ===== */
.quote-banner {
  margin: 0 16px 16px;
  padding: 16px 18px;
  background: var(--pine);
  border-radius: var(--radius-lg);
  color: white;
  position: relative;
  overflow: hidden;
}
.quote-banner::before {
  content: '"';
  position: absolute;
  right: 14px;
  top: -6px;
  font-size: 80px;
  opacity: .12;
  font-family: Georgia, serif;
  line-height: 1;
}
.quote-text { font-size: 14px; line-height: 1.75; font-weight: 500; position: relative; }
.quote-source { font-size: 11px; opacity: .65; margin-top: 6px; position: relative; }

/* ===== Stats Row ===== */
.stats-row {
  display: flex;
  gap: 10px;
  padding: 0 16px;
  margin-bottom: 16px;
}
.stat-chip {
  flex: 1;
  background: var(--cream-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 10px;
  text-align: center;
}
.stat-num { font-size: 26px; font-weight: 700; color: var(--pine); line-height: 1; }
.stat-label { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }

/* ===== Form Styles ===== */
.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
  color: var(--ink-mid);
  margin-bottom: 8px;
}
.form-input {
  width: 100%;
  padding: 13px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-mid);
  background: white;
  font-size: 15px;
  color: var(--ink);
  outline: none;
  transition: border-color .15s;
  -webkit-appearance: none;
}
.form-input:focus { border-color: var(--pine); }
.form-input::placeholder { color: var(--ink-muted); }
textarea.form-input { resize: none; min-height: 100px; line-height: 1.7; }

/* ===== Image Picker ===== */
.img-picker {
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: var(--radius-lg);
  border: 2px dashed var(--pine-mist);
  background: var(--pine-pale);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all .15s ease;
  overflow: hidden;
  position: relative;
}
.img-picker:hover { border-color: var(--pine); }
.img-picker img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.img-picker-icon { font-size: 32px; opacity: .5; }
.img-picker-text { font-size: 13px; color: var(--ink-muted); }
.img-picker-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  opacity: 0;
  transition: opacity .15s;
}
.img-picker:hover .img-picker-overlay { opacity: 1; }
.img-overlay-btn {
  background: white;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}

/* ===== Category Grid ===== */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.cat-item {
  padding: 10px 6px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all .15s ease;
}
.cat-item.selected {
  border-color: var(--pine);
  background: var(--pine-pale);
}
.cat-item:active { opacity: .7; }
.cat-icon { font-size: 24px; color: var(--pine); line-height: 1.3; }
.cat-name { font-size: 11px; color: var(--ink-mid); font-weight: 500; }
.cat-item.selected .cat-name { color: var(--pine); font-weight: 600; }

/* ===== Primary Button ===== */
.btn-primary {
  width: 100%;
  padding: 15px;
  background: var(--pine);
  color: white;
  border-radius: var(--radius-lg);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .15s ease;
  border: none;
}
.btn-primary:active { opacity: .85; transform: scale(.98); }
.btn-secondary {
  width: 100%;
  padding: 14px;
  background: transparent;
  color: var(--pine);
  border-radius: var(--radius-lg);
  font-size: 15px;
  font-weight: 500;
  border: 1.5px solid var(--pine-mist);
  transition: all .15s ease;
}
.btn-secondary:active { background: var(--pine-pale); }

/* ===== Farewell Modal ===== */
#farewell-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(44,42,37,0.5);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
#farewell-modal.show {
  opacity: 1;
  pointer-events: all;
}
.farewell-card {
  background: var(--cream-card);
  border-radius: var(--radius-xl);
  padding: 36px 28px 32px;
  text-align: center;
  max-width: 300px;
  width: 100%;
  transform: scale(.88) translateY(20px);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: var(--shadow-md);
}
#farewell-modal.show .farewell-card {
  transform: scale(1) translateY(0);
}
.farewell-leaf { font-size: 56px; margin-bottom: 16px; color: var(--pine); font-weight: 700; animation: breathe 2s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { opacity: .7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}
.farewell-title { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.farewell-quote { font-size: 14px; color: var(--ink-mid); line-height: 1.8; }
.farewell-progress {
  margin-top: 20px;
  height: 3px;
  background: var(--cream-dark);
  border-radius: 2px;
  overflow: hidden;
}
.farewell-bar {
  height: 100%;
  background: var(--pine);
  border-radius: 2px;
  animation: countdown 1.5s linear forwards;
}
@keyframes countdown { from { width: 100%; } to { width: 0%; } }

/* ===== History Timeline ===== */
.timeline-group { margin-bottom: 20px; }
.timeline-date {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 10px;
}
.timeline-date-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pine-mist);
  flex-shrink: 0;
}
.timeline-date-text { font-size: 13px; font-weight: 600; color: var(--ink-mid); }
.timeline-date-count {
  font-size: 11px;
  color: var(--pine);
  background: var(--pine-pale);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

/* ===== Week Stats Page ===== */
.week-header {
  text-align: center;
  padding: 24px 20px 12px;
}
.week-range { font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
.week-big-num {
  font-size: 72px;
  font-weight: 800;
  color: var(--pine);
  line-height: 1;
  margin: 20px 0 4px;
}
.week-num-label { font-size: 14px; color: var(--ink-mid); }
.week-cat-list { padding: 0 16px; }
.week-cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--cream-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 8px;
}
.week-cat-icon { font-size: 20px; color: var(--pine); }
.week-cat-name { flex: 1; font-size: 14px; color: var(--ink); }
.week-cat-cnt { font-size: 13px; font-weight: 600; color: var(--pine); }
.week-bar-wrap {
  flex: 1;
  height: 6px;
  background: var(--cream-dark);
  border-radius: 3px;
  overflow: hidden;
  max-width: 80px;
}
.week-bar { height: 100%; background: var(--pine-mist); border-radius: 3px; }

/* ===== Poster ===== */
#poster-wrap {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 375px;
}
.poster {
  width: 375px;
  background: var(--cream);
  padding: 0;
  overflow: hidden;
}
.poster-top {
  background: var(--pine);
  padding: 36px 28px 28px;
  color: white;
}
.poster-app { font-size: 13px; opacity: .7; letter-spacing: 1px; margin-bottom: 6px; }
.poster-title { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.poster-week { font-size: 13px; opacity: .75; }
.poster-num-wrap { display: flex; align-items: baseline; gap: 4px; margin-top: 24px; }
.poster-num { font-size: 64px; font-weight: 900; line-height: 1; }
.poster-num-unit { font-size: 18px; opacity: .8; }
.poster-imgs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
}
.poster-img-cell {
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--cream-dark);
}
.poster-img-cell img { width: 100%; height: 100%; object-fit: cover; }
.poster-img-cell-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: var(--cream-dark);
}
.poster-bottom {
  padding: 24px 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.poster-quote { font-size: 15px; line-height: 1.8; color: var(--ink-mid); }
.poster-footer { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }

/* ===== Profile Page ===== */
.profile-hero {
  padding: 28px 20px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.profile-avatar {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--pine-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--pine);
  flex-shrink: 0;
  font-weight: 700;
}
.profile-name { font-size: 20px; font-weight: 700; color: var(--ink); }
.profile-sub { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
.profile-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 16px 20px;
}
.profile-stat {
  background: var(--cream-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  text-align: center;
}
.profile-stat-num { font-size: 28px; font-weight: 800; color: var(--pine); line-height: 1; }
.profile-stat-label { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }

/* ===== Calendar Heatmap ===== */
.calendar-wrap {
  margin: 0 16px 20px;
  background: var(--cream-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.calendar-title { font-size: 13px; font-weight: 600; color: var(--ink-mid); margin-bottom: 12px; }
.calendar-grid { display: flex; gap: 4px; }
.cal-week { display: flex; flex-direction: column; gap: 4px; }
.cal-day {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--cream-dark);
  transition: background .15s;
}
.cal-day.has-1 { background: var(--pine-mist); }
.cal-day.has-2 { background: #8ab89e; }
.cal-day.has-3 { background: var(--pine-light); }
.cal-day.has-4 { background: var(--pine); }
.cal-day.today { box-shadow: 0 0 0 2px var(--pine); }
.cal-labels { display: flex; justify-content: space-between; margin-top: 8px; }
.cal-month-label { font-size: 10px; color: var(--ink-muted); }

/* ===== Sub Page (New Record) ===== */
.sub-page {
  position: fixed;
  inset: 0;
  background: var(--cream);
  z-index: 200;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
}
.sub-page.open { transform: translateY(0); }
.sub-page::-webkit-scrollbar { display: none; }
.sub-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  position: sticky;
  top: 0;
  background: var(--cream);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.sub-header-title { font-size: 17px; font-weight: 700; color: var(--ink); }

<script>
// ===========================
//  DATA LAYER
// ===========================
const DB_KEY = 'yiriyishe_v1';

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    return raw ? JSON.parse(raw) : { records: [] };
  } catch(e) {
    return { records: [] };
  }
}

function saveData(data) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(data)); } catch(e) {}
}

let db = loadData();

function addRecord(rec) {
  db.records.unshift(rec);
  saveData(db);
}

function deleteRecord(id) {
  db.records = db.records.filter(r => r.id !== id);
  saveData(db);
}

function getRecords() { return db.records; }

// ===========================
//  CATEGORIES
// ===========================
const CATEGORIES = [

  { id: 'kitchen',    icon: '食', name: '厨具餐具' },
  { id: 'books',      icon: '书', name: '书籍文具' },
  { id: 'electronics',icon: '器', name: '电子配件' },
  { id: 'food',       icon: '饮', name: '零食饮品' },
  { id: 'personal',   icon: '物', name: '个人杂物' },
  { id: 'other',      icon: '杂', name: '其他' },
];

function getCatById(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[8];
}

// ===========================
//  HEALING QUOTES
// ===========================
const QUOTES = [
  { text: '不是拥有更多，而是留下更好。少，是一种智慧。', source: '断舍离' },
  { text: '物品越少，生活越轻盈。轻装前行，才能走得更远。', source: '极简主义' },
  { text: '舍去的，不仅是物品，更是对过去的执念。', source: '断舍离' },
  { text: '整理物品，其实是整理内心。每一次放下，都是一次成长。', source: '山下英子' },
  { text: '只留下让你怦然心动的东西。其余的，感谢它，再放手。', source: '近藤麻理惠' },

  { text: '每天少一件东西，每天多一份自在。', source: '日系极简' },

  { title: '做得很好', text: '减少物欲，增加自在。今天的你，比昨天更自由了一点点。' },

function randomQuote() {
  return QUOTES[Math.floor(Math.random() * QUOTES.length)];
}

function randomFarewellQuote() {
  return FAREWELL_QUOTES[Math.floor(Math.random() * FAREWELL_QUOTES.length)];
}

// ===========================
//  UTILS
// ===========================
function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateLabel(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);

  if (formatDate(ts) === formatDate(Date.now())) return '今天';
  if (formatDate(ts) === formatDate(yesterday.getTime())) return '昨天';

  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 周${days[d.getDay()]}`;
}

function formatTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getWeekRange(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const mondayOffset = (day === 0 ? -6 : 1 - day) + offset * 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  monday.setHours(0,0,0,0);

  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);

  return { monday, sunday };
}

function formatWeekLabel(monday, sunday) {
  const fmt = d => `${d.getMonth()+1}月${d.getDate()}日`;
  return `${fmt(monday)} – ${fmt(sunday)}`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ===========================
//  IMAGE COMPRESSION
// ===========================
function compressImage(file, maxW = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(maxW / img.width, maxW / img.height, 1);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', .78));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===========================
//  ROUTER / NAV
// ===========================
let currentPage = 'home';
const pages = ['home', 'history', 'stats', 'profile'];
const pageOrder = { home: 0, history: 1, stats: 2, profile: 3 };

function navigateTo(name) {
  if (name === currentPage) return;
  const fromIdx = pageOrder[currentPage];
  const toIdx = pageOrder[name];

  const fromEl = document.getElementById(`page-${currentPage}`);
  const toEl = document.getElementById(`page-${name}`);

  fromEl.classList.remove('active');
  toEl.classList.add('active');

  // Animate
  if (toIdx > fromIdx) {
    toEl.classList.add('slide-in-right');
  } else {
    toEl.classList.add('slide-in-left');
  }
  setTimeout(() => {
    toEl.classList.remove('slide-in-right', 'slide-in-left');
  }, 300);

  currentPage = name;
  renderPage(name);

  // Update nav
  document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === name);
  });
}

document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

// ===========================
//  RENDER FUNCTIONS
// ===========================
function renderPage(name) {
  switch(name) {
    case 'home':    renderHome(); break;
    case 'history': renderHistory(); break;
    case 'stats':   renderStats(); break;
    case 'profile': renderProfile(); break;
  }
}

// ===== HOME PAGE =====
let homeFilterCat = 'all';

function renderHome() {
  const page = document.getElementById('page-home');
  const today = new Date();
  const todayStr = formatDate(Date.now());
  const todayRecords = getRecords().filter(r => formatDate(r.ts) === todayStr);
  const q = randomQuote();

  // Count by cat for today
  const catCounts = {};
  todayRecords.forEach(r => {
    catCounts[r.catId] = (catCounts[r.catId] || 0) + 1;
  });

  const catOptions = [
    { id: 'all', label: '全部' },
    ...CATEGORIES.filter(c => catCounts[c.id]).map(c => ({ id: c.id, label: c.icon + ' ' + c.name }))
  ];

  const filtered = homeFilterCat === 'all'
    ? todayRecords
    : todayRecords.filter(r => r.catId === homeFilterCat);

  page.innerHTML = `
    <div style="padding: 24px 20px 8px; display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div style="font-size:13px;color:var(--ink-muted);letter-spacing:.5px">${today.getMonth()+1}月${today.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][today.getDay()]}</div>
        <div style="font-size:24px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.3px">一日一舍</div>
      </div>
      <div style="font-size:11px;color:var(--pine);background:var(--pine-pale);padding:4px 10px;border-radius:12px;font-weight:600;">

    <div class="quote-banner">
      <div class="quote-text">${q.text}</div>
      <div class="quote-source">— ${q.source}</div>
    </div>

    <div class="stats-row">
      <div class="stat-chip">
        <div class="stat-num">${todayRecords.length}</div>
        <div class="stat-label">今日告别</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num">${getRecords().length}</div>
        <div class="stat-label">累计舍弃</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num">${getStreakDays()}</div>
        <div class="stat-label">连续天数</div>
      </div>
    </div>

    ${catOptions.length > 1 ? `<div class="pill-tabs" id="home-cat-tabs">
      ${catOptions.map(c => `<button class="pill ${homeFilterCat === c.id ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`).join('')}
    </div>` : ''}

    <div id="home-records-list">
      ${filtered.length === 0 ? renderEmptyState() : filtered.map(r => renderRecordCard(r)).join('')}
    </div>
    <div class="pb-safe"></div>
  `;

  // Bind cat tabs
  const tabs = page.querySelector('#home-cat-tabs');
  if (tabs) {
    tabs.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        homeFilterCat = pill.dataset.cat;
        renderHome();
      });
    });
  }

  // Bind record cards
  page.querySelectorAll('[data-record-id]').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.recordId));
  });
}

function renderEmptyState() {
  return `<div class="empty-state">
    <div class="empty-icon">空</div>
    <div class="empty-title">今天还没有记录</div>
    <div class="empty-sub">点击下方「+」按钮<br>开始你的第一次告别吧</div>
  </div>`;
}

function renderRecordCard(r) {
  const cat = getCatById(r.catId);
  return `<div class="record-card" data-record-id="${r.id}">
    ${r.img ? `<img class="record-card-img" src="${r.img}" alt="${r.name}" loading="lazy">` : ''}

      ${r.note ? `<div class="record-card-note">${r.note}</div>` : ''}
    </div>
  </div>`;
}

// ===== HISTORY PAGE =====
let histFilterCat = '';
let histFilterDate = '';

function renderHistory() {
  const page = document.getElementById('page-history');
  const records = getRecords();

  // Get unique dates
  const allDates = [...new Set(records.map(r => formatDate(r.ts)))].sort((a,b) => b.localeCompare(a));

  let filtered = records;
  if (histFilterCat) filtered = filtered.filter(r => r.catId === histFilterCat);
  if (histFilterDate) filtered = filtered.filter(r => formatDate(r.ts) === histFilterDate);

  // Group by date
  const groups = {};
  filtered.forEach(r => {
    const d = formatDate(r.ts);
    if (!groups[d]) groups[d] = [];
    groups[d].push(r);
  });
  const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  page.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">所有记录</div>
        <div class="page-sub">共 ${records.length} 件物品已告别</div>

      <select class="filter-select" id="hist-date-filter">
        <option value="">全部日期</option>
        ${allDates.map(d => `<option value="${d}" ${histFilterDate === d ? 'selected' : ''}>${d}</option>`).join('')}

            <div class="empty-sub">还没有符合条件的记录<br>快去打卡记录吧</div>
          </div>`
        : sortedDates.map(d => `
          <div class="timeline-group">
            <div class="timeline-date">
              <div class="timeline-date-dot"></div>
              <span class="timeline-date-text">${formatDateLabel(new Date(d).getTime())}</span>
              <span class="timeline-date-count">${groups[d].length} 件</span>
            </div>
            ${groups[d].map(r => renderRecordCard(r)).join('')}
          </div>`).join('')
      }
    </div>
    <div class="pb-safe"></div>
  `;

  page.querySelector('#hist-cat-filter').addEventListener('change', e => {
    histFilterCat = e.target.value;
    renderHistory();
  });
  page.querySelector('#hist-date-filter').addEventListener('change', e => {
    histFilterDate = e.target.value;
    renderHistory();
  });

  page.querySelectorAll('[data-record-id]').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.recordId));
  });
}

// ===== STATS PAGE =====
let statsWeekOffset = 0;

function renderStats() {
  const page = document.getElementById('page-stats');
  const { monday, sunday } = getWeekRange(statsWeekOffset);
  const weekRecords = getRecords().filter(r => r.ts >= monday.getTime() && r.ts <= sunday.getTime());

  // Count by category
  const catCounts = {};
  weekRecords.forEach(r => {
    catCounts[r.catId] = (catCounts[r.catId] || 0) + 1;
  });
  const maxCat = Math.max(1, ...Object.values(catCounts));
  const sortedCats = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);

  const weekLabel = formatWeekLabel(monday, sunday);
  const isCurrentWeek = statsWeekOffset === 0;

  page.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">周报</div>
        <div class="page-sub">本周断舍离数据</div>
      </div>
    </div>

    <div class="week-nav">
      <button class="week-nav-btn" id="week-prev">‹</button>
      <div class="week-nav-label">${weekLabel}</div>
      <button class="week-nav-btn" id="week-next" ${isCurrentWeek ? 'style="opacity:.3;pointer-events:none"' : ''}>›</button>
    </div>

    <div class="week-header">
      <div class="week-big-num">${weekRecords.length}</div>
      <div class="week-num-label">件物品告别了你的生活</div>
    </div>

    ${weekRecords.length === 0
      ? `<div class="empty-state">
          <div class="empty-icon">静</div>
          <div class="empty-title">这周还没有记录</div>
          <div class="empty-sub">开始你的断舍离之旅吧</div>
        </div>`
      : `<div class="section-hd">分类明细</div>
        <div class="week-cat-list">
          ${sortedCats.map(([catId, cnt]) => {
            const cat = getCatById(catId);
            const pct = Math.round(cnt / maxCat * 100);
            return `<div class="week-cat-row">
              <span class="week-cat-icon">${cat.icon}</span>
              <span class="week-cat-name">${cat.name}</span>
              <div class="week-bar-wrap"><div class="week-bar" style="width:${pct}%"></div></div>
              <span class="week-cat-cnt">${cnt} 件</span>
            </div>`;
          }).join('')}
        </div>`
    }

    <div style="padding: 20px 16px 8px">
      <button class="btn-primary" id="btn-gen-poster" ${weekRecords.length === 0 ? 'style="opacity:.5;pointer-events:none"' : ''}>
        <span>绘</span>
        <span>生成周总结海报</span>
      </button>
    </div>
    <div class="pb-safe"></div>
  `;

  page.querySelector('#week-prev').addEventListener('click', () => {
    statsWeekOffset--;
    renderStats();
  });
  const nextBtn = page.querySelector('#week-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    statsWeekOffset++;
    renderStats();
  });

  const posterBtn = page.querySelector('#btn-gen-poster');
  if (posterBtn) posterBtn.addEventListener('click', () => generatePoster(weekRecords, weekLabel));
}

// ===== PROFILE PAGE =====
function getStreakDays() {
  const records = getRecords();
  if (!records.length) return 0;
  const dates = [...new Set(records.map(r => formatDate(r.ts)))].sort((a,b) => b.localeCompare(a));
  let streak = 0;
  let checkDate = new Date();
  checkDate.setHours(0,0,0,0);

  for (let i = 0; i < dates.length; i++) {
    const d = formatDate(checkDate.getTime());
    if (dates.includes(d)) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      // Allow today to be missing (it's still ongoing)
      if (i === 0 && d === formatDate(Date.now())) {
        checkDate.setDate(checkDate.getDate() - 1);
        continue;
      }
      break;
    }
  }
  return streak;
}

function renderProfile() {
  const page = document.getElementById('page-profile');
  const records = getRecords();
  const streak = getStreakDays();
  const totalDays = [...new Set(records.map(r => formatDate(r.ts)))].length;

  // Most frequent category
  const catCounts = {};
  records.forEach(r => { catCounts[r.catId] = (catCounts[r.catId]||0)+1; });
  const topCat = Object.entries(catCounts).sort((a,b)=>b[1]-a[1])[0];
  const topCatObj = topCat ? getCatById(topCat[0]) : null;

  page.innerHTML = `
    <div class="profile-hero">
      <div class="profile-avatar">我</div>
      <div>
        <div class="profile-name">我的断舍离</div>
        <div class="profile-sub">每天少一点，每天轻一点</div>
      </div>
    </div>

    <div class="profile-stats">
      <div class="profile-stat">
        <div class="profile-stat-num">${records.length}</div>
        <div class="profile-stat-label">累计告别</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-num">${streak}</div>
        <div class="profile-stat-label">连续打卡</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-num">${totalDays}</div>

      </div>
    </div>

    ${topCatObj ? `<div style="margin:0 16px 16px;padding:14px 16px;background:var(--pine-pale);border-radius:var(--radius-md);display:flex;align-items:center;gap:12px">
      <span style="font-size:28px;color:var(--pine)">${topCatObj.icon}</span>
      <div>

        <div style="font-size:15px;font-weight:600;color:var(--ink)">${topCatObj.name}</div>
      </div>

    </div>

    <div style="padding:0 16px 8px">
      <div style="font-size:13px;color:var(--ink-muted);text-align:center;line-height:1.8;padding:16px;background:var(--cream-dark);border-radius:var(--radius-md)">
        所有数据保存在本地设备<br>不上传、不追踪、无广告
      </div>
    </div>

    <div class="pb-safe"></div>

  renderCalendar(page.querySelector('#cal-grid-wrap'), records);

function renderCalendar(container, records) {
  const dateSet = {};
  records.forEach(r => {
    const d = formatDate(r.ts);
    dateSet[d] = (dateSet[d]||0)+1;
  });

  const today = new Date();
  today.setHours(0,0,0,0);
  const todayStr = formatDate(Date.now());

  // Build 13 weeks = 91 days back
  const weeks = 13;
  const totalDays = weeks * 7;
  const startDate = new Date(today);
  startDate.setDate(today.getDate() - totalDays + 1);

  // Adjust to start from Monday
  const dow = startDate.getDay();
  if (dow !== 1) {
    const diff = dow === 0 ? -6 : 1 - dow;
    startDate.setDate(startDate.getDate() + diff);
  }

  let html = '<div class="calendar-grid">';
  let current = new Date(startDate);

  for (let w = 0; w < weeks + 1; w++) {
    html += '<div class="cal-week">';
    for (let d = 0; d < 7; d++) {
      if (current > today) { html += '<div></div>'; current.setDate(current.getDate()+1); continue; }
      const ds = formatDate(current.getTime());
      const cnt = dateSet[ds] || 0;
      const cls = cnt === 0 ? '' : cnt === 1 ? 'has-1' : cnt <= 3 ? 'has-2' : cnt <= 5 ? 'has-3' : 'has-4';
      const isToday = ds === todayStr;
      html += `<div class="cal-day ${cls} ${isToday?'today':''}" title="${ds}: ${cnt}件"></div>`;
      current.setDate(current.getDate()+1);
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="cal-labels"><span class="cal-month-label">少</span><span class="cal-month-label" style="color:var(--pine)">↑ 打卡天数</span><span class="cal-month-label">多</span></div>';
  container.innerHTML = html;
}

// ===========================

let selectedCatId = '';
let selectedImgData = '';

function openNewRecord() {
  selectedCatId = '';
  selectedImgData = '';

  // Reset form
  document.getElementById('input-name').value = '';
  document.getElementById('input-note').value = '';
  resetImgPicker();

  // Render cat grid
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATEGORIES.map(c => `
    <div class="cat-item" data-cat="${c.id}">
      <span class="cat-icon">${c.icon}</span>
      <span class="cat-name">${c.name}</span>
    </div>
  `).join('');

  grid.querySelectorAll('.cat-item').forEach(item => {
    item.addEventListener('click', () => {
      selectedCatId = item.dataset.cat;
      grid.querySelectorAll('.cat-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
    });
  });

  document.getElementById('sub-new-record').classList.add('open');
}

function closeNewRecord() {
  document.getElementById('sub-new-record').classList.remove('open');
}

function resetImgPicker() {
  const picker = document.getElementById('img-picker-btn');
  picker.innerHTML = `
    <span class="img-picker-icon">影</span>
    <span class="img-picker-text">点击拍照或选择图片</span>

  `;
}

document.getElementById('img-picker-btn').addEventListener('click', () => {
  document.getElementById('img-file-input').click();
});

document.getElementById('img-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  selectedImgData = await compressImage(file);
  const picker = document.getElementById('img-picker-btn');

      <span class="img-overlay-btn">重新选择</span>

document.getElementById('close-new-record').addEventListener('click', closeNewRecord);

document.getElementById('btn-confirm-farewell').addEventListener('click', () => {
  const name = document.getElementById('input-name').value.trim();

// ===========================
//  DETAIL OVERLAY
// ===========================
let detailRecordId = null;

function openDetail(id) {
  const record = getRecords().find(r => r.id === id);
  if (!record) return;
  detailRecordId = id;

  const cat = getCatById(record.catId);
  const imgEl = document.getElementById('detail-img');

  if (record.img) {
    imgEl.src = record.img;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }

  document.getElementById('detail-cat').textContent = `${cat.icon}  ${cat.name}`;
  document.getElementById('detail-name').textContent = record.name || '（未命名物品）';
  document.getElementById('detail-date').textContent = `${formatDate(record.ts)} ${formatTime(record.ts)}`;
  document.getElementById('detail-note').textContent = record.note || '';

  document.getElementById('detail-overlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('show');
  detailRecordId = null;
}

document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
});

document.getElementById('detail-delete-btn').addEventListener('click', () => {
  if (!detailRecordId) return;
  if (confirm('确认删除这条记录吗？')) {
    deleteRecord(detailRecordId);
    closeDetail();
    showToast('记录已删除');
    renderPage(currentPage);
  }
});

// ===========================
//  POSTER GENERATION
// ===========================
function generatePoster(weekRecords, weekLabel) {
  const q = randomQuote();
  const imgs = weekRecords.filter(r => r.img).slice(0, 9);
  const total = weekRecords.length;

  // Count categories
  const catCounts = {};
  weekRecords.forEach(r => { catCounts[r.catId] = (catCounts[r.catId]||0)+1; });
  const topCats = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const catStr = topCats.map(([cid,cnt]) => {
    const c = getCatById(cid);
    return `${c.icon} ${c.name} ${cnt}件`;
  }).join('  ');

  const posterEl = document.getElementById('poster-canvas');
  posterEl.innerHTML = `
    <div class="poster-top">
      <div class="poster-app">一 日 一 舍</div>
      <div class="poster-title">本周断舍离</div>
      <div class="poster-week">${weekLabel}</div>
      <div class="poster-num-wrap">
        <div class="poster-num">${total}</div>
        <div class="poster-num-unit">件</div>
      </div>
    </div>
    <div class="poster-imgs">
      ${Array.from({length:9}).map((_,i) => {
        if (imgs[i]) {
          return `<div class="poster-img-cell"><img src="${imgs[i].img}" alt=""></div>`;
        } else if (weekRecords[i]) {
          const cat = getCatById(weekRecords[i].catId);
          return `<div class="poster-img-cell poster-img-cell-placeholder">${cat.icon}</div>`;
        } else {
          return `<div class="poster-img-cell" style="background:var(--cream-dark)"></div>`;
        }
      }).join('')}
    </div>
    <div class="poster-bottom">
      <div class="poster-quote">「${q.text}」</div>
      ${catStr ? `<div style="font-size:12px;color:var(--ink-muted)">${catStr}</div>` : ''}
      <div class="poster-footer">${new Date().getFullYear()}年 · 一日一舍</div>
    </div>
  `;

  showToast('海报生成中…');

  const wrap = document.getElementById('poster-wrap');
  wrap.style.left = '0';
  wrap.style.top = '-9999px';

  setTimeout(() => {
    if (!html2canvas) {
      wrap.style.left = '-9999px';
      showToast('海报功能需要联网加载');
      return;
    }
    html2canvas(posterEl, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#f5f0e8',
      logging: false,
    }).then(canvas => {
      wrap.style.left = '-9999px';

      const link = document.createElement('a');
      link.download = `一日一舍_${weekLabel.replace(/\s/g,'')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('海报已保存 🎉');
    }).catch(() => {
      wrap.style.left = '-9999px';
      showToast('生成失败，请重试');
    });
  }, 300);
}
